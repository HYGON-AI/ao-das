name: TorchAO HCU CI
run-name: "TorchAO HCU CI - ${{ github.event_name }} - ${{ github.event.pull_request.number || github.ref_name }} - attempt ${{ github.run_attempt }}"

on:
  push:
    branches: [v0.18.0-dev]
  pull_request_target:
    branches: [v0.18.0-dev]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read

defaults:
  run:
    shell: bash

env:
  ROCM_PATH: /opt/dtk
  PYPI_URL: ${{ vars.PYPI_URL }}
  RESOURCE_SERVER_URL: ${{ vars.RESOURCE_SERVER_URL }}

jobs:
  authorize-pr:
    name: Check PR Labels
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      authorized: ${{ steps.authorization.outputs.authorized }}
    steps:
      - name: Verify ready-hcu authorization
        id: authorization
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const label = "ready-hcu";
            const action = context.payload.action;
            const pullRequest = context.payload.pull_request;
            const labels = pullRequest.labels.map(item => item.name);
            const resetActions = new Set(["opened", "reopened", "ready_for_review"]);
            core.setOutput("authorized", "false");

            if (resetActions.has(action)) {
              core.notice(`HCU CI is locked. Apply the ${label} label to run it.`);
              return;
            }

            if (action === "synchronize") {
              if (labels.includes(label)) {
                core.setOutput("authorized", "true");
              } else {
                core.notice(`HCU CI is locked. Apply the ${label} label to run it.`);
              }
              return;
            }

            if (action !== "labeled" || context.payload.label?.name !== label) {
              return;
            }

            const response = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: context.actor,
            });
            const permission = response.data.permission;
            if (!new Set(["write", "maintain", "admin"]).has(permission)) {
              core.setFailed(`${context.actor} cannot authorize HCU CI.`);
              return;
            }

            core.setOutput("authorized", "true");

  build:
    name: Build, test, and publish HCU wheel (${{ matrix.dtk }})
    needs: authorize-pr
    if: >-
      ${{
        always() &&
        ((github.event_name == 'pull_request_target' &&
          needs.authorize-pr.result == 'success' &&
          needs.authorize-pr.outputs.authorized == 'true') ||
         (github.event_name == 'push' &&
          github.repository == 'HYGON-AI/ao-das') ||
         github.event_name == 'workflow_dispatch')
      }}
    runs-on: bw1100
    timeout-minutes: 7200
    strategy:
      fail-fast: false
      matrix:
        include:
          - dtk: '2604'
            image: 26.04-ubuntu22.04-py3.10
            index: nightly/dtk2604
            torch: 2.11.0
            pkg: DTK-26.04-rc4-centos8-x86_64.tar.gz
          - dtk: '2610'
            image: 26.10-ubuntu22.04-py3.12
            index: das_nightly/dtk2610
            torch: 2.11.0
            pkg: DTK-26.10-CentOS8.5-x86_64.tar.gz
    env:
      DTK_VERSION: ${{ matrix.dtk }}
      PIP_INDEX_PATH: ${{ matrix.index }}
      TORCH_VERSION: ${{ matrix.torch }}
      DTK_PKG_NAME: ${{ matrix.pkg }}
      LOCAL_RUN_ROOT: /tmp/ao-das/${{ github.run_id }}/${{ github.run_attempt }}/${{ matrix.dtk }}
    concurrency:
      group: torchao-hcu-${{ github.event.pull_request.number || github.ref }}-${{ matrix.dtk }}
      cancel-in-progress: true
    container:
      image: ${{ vars.HARBOR_SITE }}/hcu/base/dtk:${{ matrix.image }}
      volumes:
        - /opt/hyhal:/opt/hyhal:ro
      options: >-
        --device=/dev/kfd --device=/dev/dri
        --group-add=video --shm-size=80G --privileged
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.base.sha || github.sha }}
      - name: Configure Git safe directories
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git config --global --add safe.directory \
            "${GITHUB_WORKSPACE}/third_party/cutlass"
      - name: Merge PR into target branch
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 -w0)"
          git -c http.extraheader="AUTHORIZATION: basic ${auth}" \
            fetch --no-tags origin "pull/${PR_NUMBER}/head"
          test "$(git rev-parse FETCH_HEAD)" = "${PR_HEAD_SHA}"
          git -c user.name=github-actions -c user.email=ci@github \
            merge --no-ff --no-edit "${PR_HEAD_SHA}"
      - name: Initialize submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --force --recursive
      - name: Build wheel
        run: bash .github/scripts/build-hcu-wheel.sh
      - name: Test HCU wheel
        if: github.event_name == 'pull_request_target'
        run: bash .github/scripts/test-hcu.sh
      - name: Repair and upload wheel
        if: >-
          github.event_name == 'push' &&
          github.repository == 'HYGON-AI/ao-das' &&
          github.ref == 'refs/heads/v0.18.0-dev'
        env:
          PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
        run: |
          source .github/scripts/build-hcu-wheel.sh
          pip_install CIUpload
          dtk_version="$(tr -d '.[:space:]' < /opt/dtk/.info/rocm_version)"
          CIUpload REPAIR \
            --dtk_version "${dtk_version}" \
            --torch_version "${TORCH_VERSION}" \
            --git_commit "${GITHUB_SHA:0:6}" \
            --outputdir "${LOCAL_RUN_ROOT}/output" \
            -f "${LOCAL_RUN_ROOT}"/dist/*.whl
          CIUpload NIGHTLY \
            --devpi_url "${PYPI_URL}" \
            --password "${PYPI_PASSWORD}" \
            --dtk_pkg_name "${DTK_PKG_NAME}" \
            --record --repo "${GITHUB_WORKSPACE}" \
            -f "${LOCAL_RUN_ROOT}"/output/*.whl
